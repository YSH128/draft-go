# 1. 사용할 스테이지 이름을 명시적으로 선언합니다.
stages:
  - notify

notify_mr_merged:
  stage: notify
  image: curlimages/curl:latest
  tags:
    - mattermost
  rules:
    # dev나 master 브랜치에 'Merge branch' 또는 'Merge request' 문구가 포함된 커밋이 push될 때만 실행
    - if: ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master") && ($CI_COMMIT_TITLE =~ /^Merge branch.*/ || $CI_COMMIT_TITLE =~ /^Merge request.*/)
  script:
    - |
      # 1. 현재 커밋 SHA와 연관된 MR 정보를 API로 조회 (배열 형태로 반환됨)
      MR_DATA=$(curl --header "JOB-TOKEN: $CI_JOB_TOKEN" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/merge_requests")
      
      # 2. JSON 데이터에서 필요한 정보 추출 (sed를 사용한 기초적인 파싱)
      # [!] MR이 여러 개일 수 있으므로 첫 번째 값을 가져옵니다.
      MR_TITLE=$(echo $MR_DATA | sed -n 's/.*"title":"\([^"]*\)".*/\1/p' | head -n 1)
      MR_URL=$(echo $MR_DATA | sed -n 's/.*"web_url":"\([^"]*\)".*/\1/p' | head -n 1)
      MR_DESC=$(echo $MR_DATA | sed -n 's/.*"description":"\([^"]*\)".*/\1/p' | head -n 1 | cut -c 1-300)

      # 3. 만약 API 응답이 비어있다면(직접 푸시 등), 커밋 정보를 대신 사용
      if [ -z "$MR_TITLE" ]; then
        MR_TITLE=$CI_COMMIT_TITLE
        MR_URL="${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}"
        MR_DESC="Merge Request 정보를 찾을 수 없어 커밋 정보로 대체합니다."
      fi

      # 4. Mattermost 메시지 전송
      PAYLOAD=$(cat <<EOF
      {
        "text": "🎊 **Merge Request 병합 완료!**\n\n**📌 제목:** ${MR_TITLE}\n**📝 설명:** ${MR_DESC}\n**🔗 바로가기:** ${MR_URL}"
      }
      EOF
      )

      curl -i -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "${MM_WEBHOOK_URL}"