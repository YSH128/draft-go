# ===============================
# 1️⃣ HTTP → HTTPS 리다이렉트
# ===============================
server {
    listen 80;
    server_name draft-go.com www.draft-go.com;

    return 301 https://$host$request_uri;
}

# ===============================
# 2️⃣ HTTPS + Front(정적) + API + WS
# ===============================
server {
    listen 443 ssl;
    server_name draft-go.com www.draft-go.com;

    # SSL 인증서 (Certbot)
    ssl_certificate     /etc/letsencrypt/live/draft-go.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/draft-go.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 프론트 정적 파일
    root /var/www/draft-go-fe;
    index index.html;

    # SPA 라우팅
    location / {
        try_files $uri /index.html;
    }

    # 백엔드 API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Swagger UI
    location /swagger-ui {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # OpenAPI Docs
    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # kibana
    location /kibana/ {
        proxy_pass http://127.0.0.1:5601;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /grafana 루트 접근 시 대시보드로 리다이렉트
    location = /grafana {
        return 302 /grafana/d/spring_boot_21;
    }

    # /grafana 리다이렉트
    location = /grafana/ {
        return 302 /grafana/d/spring_boot_21;
    }

    # grafana
    location /grafana/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ai
    location /ai/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }



}